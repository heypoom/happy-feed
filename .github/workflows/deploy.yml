name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: .cache
          key: feed-cache-${{ github.run_id }}
          restore-keys: feed-cache-
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e
      - run: bun run fetch
        env:
          RSS_BRIDGE: ${{ secrets.RSS_BRIDGE || vars.RSS_BRIDGE }}
          RSS_BRIDGE_FACEBOOK: ${{ secrets.RSS_BRIDGE_FACEBOOK || vars.RSS_BRIDGE_FACEBOOK }}
      - run: bun run build
      - run: npx cf deploy dist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
